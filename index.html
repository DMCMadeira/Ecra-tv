<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMC Madeira — Ecrã TV</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0c0e;
    color: #e8eaec;
    font-family: system-ui, sans-serif;
  }

  #app {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
  }

  h1 {
    font-size: 15px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6b7278;
    margin-bottom: 8px;
  }

  #links {
    display: flex;
    gap: 20px;
  }

  a.option {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px;
    width: 220px;
    padding: 28px 20px;
    background: #111416;
    border: 0.5px solid #232729;
    border-radius: 12px;
    color: #e8eaec;
    text-decoration: none;
    transition: border-color .15s, background .15s;
  }

  a.option:hover {
    background: #181c1f;
    border-color: #4a9eff;
  }

  a.option .label {
    font-size: 16px;
    font-weight: 600;
  }

  a.option .desc {
    font-size: 12px;
    color: #6b7278;
    text-align: center;
  }
</style>
</head>
<body>

<div id="app">
  <h1>DMC Madeira — Ecrã TV</h1>
  <div id="links">
    <a class="option" href="overview_dashboard.html">
      <span class="label">Dashboard</span>
      <span class="desc">Vídeos, radar e voos</span>
    </a>
    <a class="option" href="analytics_dashboard.html">
      <span class="label">Analytics</span>
      <span class="desc">Google Analytics em tempo real</span>
    </a>
  </div>
</div>

</body>
</html>
