  html, body {
    width: 100%; height: 100%;
    background: #0a0c0e;
    color: #e8eaec;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  #app {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    padding: 24px;
    gap: 14px;
  }

  #hero {
    display: flex; align-items: flex-end; gap: 24px;
    padding: 0 8px;
  }

  #active-users-block { display: flex; flex-direction: column; }

  #active-users-label {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b7278;
  }

  #active-users {
    font-size: 60px;
    font-weight: 600;
    line-height: 1;
    color: #3ecf8e;
  }

  #timeline-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  #timeline-label { font-size: 11px; color: #454c52; }
  #timeline {
    flex: 1;
    display: flex; align-items: flex-end; gap: 2px;
    height: 46px;
  }
  #timeline .bar {
    flex: 1;
    background: #2d3235;
    border-radius: 2px 2px 0 0;
    min-height: 2px;
  }
  #timeline .bar.active { background: #4a9eff; }

  #updated-at {
    font-size: 13px;
    color: #454c52;
    white-space: nowrap;
  }

  #grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1.6fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    min-height: 0;
  }

  #map-card { grid-row: 1 / 3; }

  #world-map {
    flex: 1;
    min-height: 0;
    position: relative;
    background-image: var(--world-map-bg);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    border-radius: 6px;
  }
  #world-map svg { width: 100%; height: 100%; display: block; position: absolute; inset: 0; }
  #world-map .dot { fill: #3ecf8e; }
  #world-map .dot-pulse {
    fill: none; stroke: #3ecf8e; stroke-width: 1.5; opacity: 0.6;
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { r: 3;  opacity: 0.6; }
    100% { r: 14; opacity: 0; }
  }

  .card {
    background: #111416;
    border: 0.5px solid #232729;
    border-radius: 10px;
    padding: 14px 18px;
    display: flex; flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .card h2 {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6b7278;
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  .row-list {
    display: flex; flex-direction: column;
    gap: 6px;
    overflow: hidden;
  }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 6px 10px;
    background: #181c1f;
    border-radius: 6px;
    font-size: 14px;
  }

  .row .name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #e8eaec;
  }

  .row .count {
    font-family: 'DM Mono', monospace;
    color: #4a9eff;
    flex-shrink: 0;
  }

  .empty {
    font-size: 13px;
    color: #454c52;
    padding: 6px 10px;
  }

  #error-box {
    display: none;
    font-size: 15px;
    color: #e84040;
    padding: 0 8px;
  }
</style>
</head>
<body>

<div id="app">
  <div id="hero">
    <div id="active-users-block">
      <div id="active-users-label">Utilizadores ativos agora</div>
      <div id="active-users">—</div>
    </div>
    <div id="timeline-wrap">
      <div id="timeline-label">Últimos 30 minutos</div>
      <div id="timeline"></div>
    </div>
    <div id="updated-at">A carregar...</div>
  </div>

  <div id="error-box"></div>

  <div id="grid">
    <div class="card">
      <h2>Páginas mais vistas</h2>
      <div class="row-list" id="byPage"></div>
    </div>
    <div class="card">
      <h2>Dispositivo</h2>
      <div class="row-list" id="byDevice"></div>
    </div>
    <div class="card">
      <h2>Plataforma</h2>
      <div class="row-list" id="byPlatform"></div>
    </div>
    <div class="card" id="map-card">
      <h2>Localização dos utilizadores</h2>
      <div id="world-map">
        <svg viewBox="0 0 1000 500" preserveAspectRatio="none"></svg>
      </div>
    </div>
    <div class="card">
      <h2>Cidade</h2>
      <div class="row-list" id="byCity"></div>
    </div>
    <div class="card">
      <h2>Eventos</h2>
      <div class="row-list" id="byEvent"></div>
    </div>
  </div>
</div>

<script>
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwXhv8HviVf3gw-tQU0XllrMa9djaJfGP0LprPR_-UETq2aCbr88UWFHm9l5iVd3XwjyA/exec';
  const DATA_REFRESH_MS = 30 * 1000;       // atualiza os números a cada 30s
  const PAGE_RELOAD_MS  = 30 * 60 * 1000;  // recarrega a página a cada 30 min

  const CARD_KEYS = ['byPage', 'byDevice', 'byPlatform', 'byCity', 'byEvent'];

  // Coordenadas aproximadas (x,y no viewBox 1000x500, projeção equirretangular) dos principais mercados.
  const COUNTRY_COORDS = {
    'Portugal': [478, 200], 'Spain': [472, 200], 'France': [488, 175],
    'United Kingdom': [478, 155], 'Germany': [500, 165], 'Italy': [510, 195],
    'Netherlands': [490, 160], 'Belgium': [487, 165], 'Switzerland': [495, 178],
    'Ireland': [462, 150], 'Sweden': [510, 130], 'Norway': [500, 120],
    'Denmark': [500, 150], 'Poland': [518, 160], 'Austria': [505, 175],
    'United States': [220, 190], 'Canada': [210, 130], 'Mexico': [190, 240],
    'Brazil': [310, 340], 'Argentina': [290, 420],
    'China': [780, 195], 'Japan': [850, 190], 'India': [700, 230],
    'Australia': [860, 400], 'South Africa': [545, 400],
    'Russia': [650, 110], 'Ukraine': [560, 155],
  };
  const DEFAULT_COORD = [500, 250]; // fallback: centro do mapa

  function pad(n) { return String(n).padStart(2, '0'); }

  function renderCard(key, rows) {
    const container = document.getElementById(key);
    container.innerHTML = '';
    if (!rows || !rows.length) {
      container.innerHTML = '<div class="empty">Sem dados</div>';
      return;
    }
    rows.forEach(function(r) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="name">' + r.label + '</span><span class="count">' + r.users + '</span>';
      container.appendChild(row);
    });
  }

  function renderMap(byCountry) {
    const svgNs = 'http://www.w3.org/2000/svg';
    const svg = document.querySelector('#world-map svg');

    svg.querySelectorAll('g.map-dot-group').forEach(function(g) { g.remove(); });
    if (!byCountry || !byCountry.length) return;

    byCountry.forEach(function(c) {
      const coord = COUNTRY_COORDS[c.label] || DEFAULT_COORD;
      const group = document.createElementNS(svgNs, 'g');
      group.setAttribute('class', 'map-dot-group');

      const pulse = document.createElementNS(svgNs, 'circle');
      pulse.setAttribute('class', 'dot-pulse');
      pulse.setAttribute('cx', coord[0]);
      pulse.setAttribute('cy', coord[1]);
      pulse.setAttribute('r', 3);

      const dot = document.createElementNS(svgNs, 'circle');
      dot.setAttribute('class', 'dot');
      dot.setAttribute('cx', coord[0]);
      dot.setAttribute('cy', coord[1]);
      dot.setAttribute('r', 4);

      group.appendChild(pulse);
      group.appendChild(dot);
      svg.appendChild(group);
    });
  }

  function renderTimeline(timeline) {
    const container = document.getElementById('timeline');
    container.innerHTML = '';
    if (!timeline || !timeline.length) return;
    const max = Math.max.apply(null, timeline.concat([1]));
    timeline.forEach(function(v, i) {
      const bar = document.createElement('div');
      bar.className = 'bar' + (i === timeline.length - 1 && v > 0 ? ' active' : '');
      bar.style.height = Math.max(2, (v / max) * 100) + '%';
      container.appendChild(bar);
    });
  }

  function fetchData() {
    fetch(ENDPOINT)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) throw new Error(data.error);
        document.getElementById('active-users').textContent = data.activeUsers;
        CARD_KEYS.forEach(function(key) { renderCard(key, data[key]); });
        renderMap(data.byCountry);
        renderTimeline(data.timeline);
        const n = new Date();
        document.getElementById('updated-at').textContent =
          'Atualizado às ' + pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
        document.getElementById('error-box').style.display = 'none';
      })
      .catch(function(err) {
        const box = document.getElementById('error-box');
        box.textContent = 'Erro a obter dados: ' + err.message;
        box.style.display = 'block';
      });
  }

  fetchData();
  setInterval(fetchData, DATA_REFRESH_MS);
  setTimeout(function() { location.reload(); }, PAGE_RELOAD_MS);
</script>
</body>
</html>
