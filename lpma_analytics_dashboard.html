<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMC Madeira — Google Analytics</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0c0e;
    color: #e8eaec;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }

  #app {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
    padding: 40px;
  }

  #active-users-label {
    font-size: 20px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b7278;
  }

  #active-users {
    font-size: 220px;
    font-weight: 600;
    line-height: 1;
    color: #3ecf8e;
  }

  #pages {
    width: 100%;
    max-width: 900px;
    display: flex; flex-direction: column;
    gap: 10px;
  }

  .page-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px;
    background: #111416;
    border: 0.5px solid #232729;
    border-radius: 8px;
    font-size: 18px;
  }

  .page-row .name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #e8eaec;
  }

  .page-row .count {
    font-family: 'DM Mono', monospace;
    color: #4a9eff;
    margin-left: 20px;
    flex-shrink: 0;
  }

  #updated-at {
    font-size: 13px;
    color: #454c52;
  }

  #error-box {
    display: none;
    font-size: 16px;
    color: #e84040;
    text-align: center;
  }
</style>
</head>
<body>

<div id="app">
  <div>
    <div id="active-users-label">Utilizadores ativos agora</div>
    <div id="active-users">—</div>
  </div>

  <div id="pages"></div>

  <div id="updated-at">A carregar...</div>
  <div id="error-box"></div>
</div>

<script>
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzCpfh5POKbP6_jKmRB2hhu86QQdpnJCSEXPNYiiDOsbb8d3Ec0PPnerU9EcSxpUDfjTg/exec';
  const DATA_REFRESH_MS = 20 * 1000;       // atualiza os números a cada 20s
  const PAGE_RELOAD_MS  = 30 * 60 * 1000;  // recarrega a página a cada 30 min

  function pad(n) { return String(n).padStart(2, '0'); }

  function renderPages(topPages) {
    const container = document.getElementById('pages');
    container.innerHTML = '';
    (topPages || []).forEach(function(p) {
      const row = document.createElement('div');
      row.className = 'page-row';
      row.innerHTML = '<span class="name">' + p.page + '</span><span class="count">' + p.users + '</span>';
      container.appendChild(row);
    });
  }

  function fetchData() {
    fetch(ENDPOINT)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) throw new Error(data.error);
        document.getElementById('active-users').textContent = data.activeUsers;
        renderPages(data.topPages);
        const n = new Date();
        document.getElementById('updated-at').textContent =
          'Atualizado às ' + pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
        document.getElementById('error-box').style.display = 'none';
      })
      .catch(function(err) {
        const box = document.getElementById('error-box');
        box.textContent = 'Erro a obter dados: ' + err.message;
        box.style.display = 'block';
      });
  }

  fetchData();
  setInterval(fetchData, DATA_REFRESH_MS);
  setTimeout(function() { location.reload(); }, PAGE_RELOAD_MS);
</script>
</body>
</html>
